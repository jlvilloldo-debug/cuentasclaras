function num(id,label,val,min,max,step,keepEmpty){
  const inp=el("input",{type:"number",id,value:String(val),min:String(min),max:String(max),step:String(step),inputmode:"decimal"});
  const hint=el("span",{class:"adj"});hint.hidden=true;
  const get=()=>{const v=parseFloat(inp.value);return isFinite(v)?Math.min(max,Math.max(min,v)):val};
  inp.addEventListener("change",()=>{const raw=parseFloat(inp.value),v=get();
    if(!isFinite(raw)){if(keepEmpty){inp.value="";hint.hidden=true}else{inp.value=String(val);hint.textContent=`Campo vacío: se usa ${val}`;hint.hidden=false}}
    else if(raw!==v){inp.value=String(v);hint.textContent=`Ajustado al rango ${min} a ${max}`;hint.hidden=false}
    else hint.hidden=true;
    inp.dispatchEvent(new Event("input"))});
  return {wrap:el("label",{for:id},label,inp,hint),inp,get,raw:()=>inp.value.trim()===""?NaN:parseFloat(inp.value)};
}

function compoundCalc(){
  const ini=num("c-ini","Monto inicial",100000,0,1e12,1000), mon=num("c-mes","Aporte mensual",20000,0,1e10,1000),
        rate=num("c-tasa","Rendimiento anual % (real, sobre inflación)",6,-20,100,0.5), yrs=num("c-anios","Años",20,1,60,1);
  const oT=el("b"),oA=el("b"),oG=el("b"); const chart=el("div",{class:"chartbox"});
  const box=el("div",null,el("div",{class:"calc"},ini.wrap,mon.wrap,rate.wrap,yrs.wrap),
    el("div",{class:"out",style:"margin:14px 0"},el("div",null,oT,el("span",{text:"Valor final"})),el("div",null,oA,el("span",{text:"Lo que pusiste"})),el("div",null,oG,el("span",{text:"Ganancia o pérdida por rendimiento"}))),chart);
  function up(){
    const P0=ini.get(),M=mon.get(),r=Math.pow(1+rate.get()/100,1/12)-1,N=Math.round(yrs.get());
    let v=P0,ap=P0;const pts=[{y:0,v,ap}];
    for(let m=1;m<=N*12;m++){v=v*(1+r)+M;ap+=M;if(m%12===0)pts.push({y:m/12,v,ap})}

}

function drawChart(host,pts){
  const NS="http://www.w3.org/2000/svg",W=640,H=240,L=70,R=16,T=12,B=28;
  const max=Math.max(1,...pts.map(p=>Math.max(p.v,p.ap))),n=pts[pts.length-1].y||1;
  const x=y=>L+(W-L-R)*y/n, yv=v=>T+(H-T-B)*(1-Math.max(0,v)/max);
  const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${W} ${H}`);s.setAttribute("width","100%");s.setAttribute("style","display:block");
  s.setAttribute("role","img");s.setAttribute("aria-label","Evolución del valor frente a lo aportado");
  const add=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.append(e);return e};
  for(let i=0;i<=4;i++){const v=max*i/4,yy=yv(v);add("line",{x1:L,x2:W-R,y1:yy,y2:yy,stroke:"var(--rule)","stroke-width":1});
    const t=add("text",{x:L-8,y:yy+4,"text-anchor":"end"});t.textContent=v>=1e6?(v/1e6).toFixed(1)+"M":Math.round(v/1e3)+"k"}
  const step=Math.max(1,Math.ceil(n/6));for(let y=0;y<=n;y+=step){const t=add("text",{x:x(y),y:H-8,"text-anchor":"middle"});t.textContent=y+"a"}
  const line=k=>pts.map((p,i)=>(i?"L":"M")+x(p.y).toFixed(1)+" "+yv(p[k]).toFixed(1)).join(" ");
  add("path",{d:line("v")+` L${x(n)} ${yv(0)} L${x(0)} ${yv(0)} Z`,fill:"var(--accent-soft)",stroke:"none"});
  add("path",{d:line("ap"),fill:"none",stroke:"var(--muted)","stroke-width":2,"stroke-dasharray":"5 4"});
  add("path",{d:line("v"),fill:"none",stroke:"var(--accent)","stroke-width":2.5});
  const last=pts[pts.length-1];add("circle",{cx:x(last.y),cy:yv(last.v),r:4,fill:"var(--accent)"});
  const lg1=add("text",{x:L+8,y:T+14});lg1.textContent="— valor total";lg1.setAttribute("style","fill:var(--accent)");
  const lg2=add("text",{x:L+8,y:T+40});lg2.textContent="- - lo aportado";
  host.replaceChildren(s);
}

function quiz(questions,doneId){

  const need=Math.ceil(questions.length*0.8);
  const order=(i,n)=>{const a=[...Array(n).keys()];let seed=(i+1)*2654435761%4294967296;for(let k=n-1;k>0;k--){seed=(seed*1103515245+12345)%2147483648;const j=seed%(k+1);[a[k],a[j]]=[a[j],a[k]]}return a};
  questions.forEach((q,i)=>{const fs=el("fieldset",null,el("legend",{text:(i+1)+". "+q.q}));
    order(i+doneId.length,q.o.length).forEach(j=>{const o=q.o[j],id=`q${i}o${j}`;fs.append(el("label",{class:"opt",for:id},el("input",{type:"radio",name:"q"+i,id,value:String(j)}),el("span",{text:o})))});

  const btn=el("button",{class:"btn",type:"submit",text:"Corregir"}); form.append(btn,res);
  form.addEventListener("submit",ev=>{ev.preventDefault();let ok=0;
    questions.forEach((q,i)=>{const sel=form.querySelector(`input[name="q${i}"]:checked`);const fb=form.querySelectorAll("fieldset")[i].querySelector(".fb");
      const right=sel&&+sel.value===q.a; if(right)ok++; fb.hidden=false; fb.className="fb "+(right?"ok":"no");
      fb.textContent=(right?"Correcto. ":sel?"No. ":"Sin responder. ")+q.e});

// Validación estricta: solo se aceptan números finitos y textos; cualquier dato fuera de forma se descarta.
function validarEmpresas(raw){
  const out={};const num=v=>typeof v==="number"&&isFinite(v);
  const arr5=(a,allowNull)=>Array.isArray(a)&&a.length===5&&a.every(v=>num(v)||(allowNull&&v===null));
  for(const k of Object.keys(raw||{})){
    if(!/^[A-Z]{1,6}$/.test(k))continue;const e=raw[k];if(!e||typeof e!=="object")continue;
    if(typeof e.nombre!=="string"||typeof e.negocio!=="string")continue;
    if(!arr5(e.anios)&&!(Array.isArray(e.anios)&&e.anios.length===5&&e.anios.every(a=>/^\d{4}$/.test(a))))continue;
    if(!["ingresos","brutos","neta","bpa","acciones"].every(f=>arr5(e[f])))continue;
    if(e.fcl!==null&&!arr5(e.fcl))continue;
    if(!arr5(e.patrimonio,true))continue;
    if(e.deuda!==null&&!arr5(e.deuda))continue;
    if(e.precio!==null&&!(num(e.precio)&&e.precio>0&&typeof e.fechaPrecio==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(e.fechaPrecio)))continue;
    if(!e.ingresos.every(v=>v>0)||!e.acciones.every(v=>v>0)||!e.brutos.every((b,i)=>b<=e.ingresos[i]))continue;
    out[k]={...e,notas:Array.isArray(e.notas)?e.notas.filter(n=>typeof n==="string"):[]};
  }
  return out;
}

// Valor de una acción por ganancias: 10 años creciendo a g, descontados a r, más un valor final de m veces la ganancia del año 10.
function valorPorGanancias(bpa,g,r,m,anios){
  anios=anios||10;
  if(!(bpa>0)||!isFinite(g)||!isFinite(r)||!isFinite(m)||r<=-1||g<=-1||m<0)return null;
  let v=0,e=bpa;
  for(let t=1;t<=anios;t++){e*=1+g;v+=e/Math.pow(1+r,t)}
  v+=m*e/Math.pow(1+r,anios);
  return v;
}

// Crecimiento anual que hace falta para que el valor iguale al precio (búsqueda binaria entre -50% y +100%).
function crecimientoImplicito(precio,bpa,r,m){
  if(!(precio>0)||!(bpa>0))return null;
  let lo=-0.5,hi=1.0;
  const f=g=>valorPorGanancias(bpa,g,r,m)-precio;
  if(f(lo)>0)return lo; if(f(hi)<0)return null;
  for(let i=0;i<100;i++){const mid=(lo+hi)/2;if(f(mid)>0)hi=mid;else lo=mid}
  return (lo+hi)/2;
}
